[workspace]
resolver = "3"
members = ["crates/massicot", "crates/essais"]
# Engines copied from PdfCraft and its dependencies (scripts/importer-moteurs.py, ATTRIBUTION.md):
# not members, so `cargo test --workspace` runs Massicot's tests only.
exclude = [
    "crates/cos", "crates/content", "crates/organize", "crates/fonts", "crates/geom",
    "crates/render", "crates/ocr", "vendor",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/JRRocks/Massicot"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 4
lto = "thin"
strip = "debuginfo"

# Third-party code is optimised in debug builds too: tests that rasterise or OCR pages stay fast.
[profile.dev.package."*"]
opt-level = 2
debug = false

# PdfCraft's patched copies of these crates.io crates (vendor/, see ATTRIBUTION.md).
[patch.crates-io]
hayro-interpret = { path = "vendor/hayro-interpret" }
hayro = { path = "vendor/hayro" }
hayro-syntax = { path = "vendor/hayro-syntax" }
hayro-cmap = { path = "vendor/hayro-cmap" }
hayro-postscript = { path = "vendor/hayro-postscript" }
hayro-jbig2 = { path = "vendor/hayro-jbig2" }
lopdf = { path = "vendor/lopdf" }
vello_common = { path = "vendor/vello_common" }
vello_cpu = { path = "vendor/vello_cpu" }
