[workspace]
resolver = "3"
members = ["crates/massicot"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/JRRocks/Massicot"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 4
lto = "thin"
strip = "debuginfo"

# Third-party code is optimised in debug builds too: tests that rasterise or OCR pages stay fast.
[profile.dev.package."*"]
opt-level = 2
debug = false
