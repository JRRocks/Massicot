[package]
name = "pdfcraft-render"
description = "Page rendering (bootstrap: hayro) and document inspection for PdfCraft"
version = "0.21.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
autotests = false
autobenches = false
autoexamples = false

[dependencies]
pdfcraft-cos = {path = "../cos", version = "0.21.0"}
pdfcraft-fonts = {path = "../fonts", version = "0.21.0"}
# The usable-quad rule `/QuadPoints` readers share.
pdfcraft-geom = {path = "../geom", version = "0.21.0"}
hayro ={version = "0.7.1"}
hayro-syntax = {version = "0.7.2"}
# Picks the face of an installed font collection (the version pdfcraft-fonts already uses).
skrifa = "0.44"
lopdf = {version = "0.45"}
kurbo = {version = "0.13"}
thiserror = {version = "2"}
log = {version = "0.4"}
# The reading-colours setting is persisted with the app state and echoed by the automation tool.
serde = {version = "1", features = ["derive", "rc"]}
# Reads rendered pixel words as bytes; already in the tree through hayro.
bytemuck = {version = "1"}
# Resolves relative URI actions against the catalog's /URI /Base, by the rules the browser uses;
# already in the tree (pdfcraft-engine checks document links with it).
url = "2.5"
# Tells combining marks (bidi class NSM: general categories Mn and Me) in extracted text; the
# version pdfcraft-fonts already uses.
unicode-bidi = "0.3"

# lopdf (bootstrap) draws random bytes for encryption; on the web they come from the browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = {version = "0.4", features = ["wasm_js"]}

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
