[package]
name = "massicot"
description = "Boîte à outils PDF : fusion, découpe, extraction, rotation, mélange, OCR et découpe par en-tête"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "massicot"
path = "src/main.rs"

# The Start menu shortcut's target: opens the window of massicot.exe without a console.
[[bin]]
name = "massicot-fenetre"
path = "src/bin/massicot-fenetre.rs"

[lints]
workspace = true

[dependencies]
regex = "1"
regex-syntax = "0.8"
sha2 = "0.11"
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
pdfcraft-cos = { path = "../cos" }
pdfcraft-organize = { path = "../organize" }
pdfcraft-render = { path = "../render" }
pdfcraft-ocr = { path = "../ocr" }
pdfcraft-fonts = { path = "../fonts" }
pdfcraft-content = { path = "../content" }
# The window (`massicot fenetre`), in egui like PdfCraft (D-09).
# Without egui's own fonts: the window uses Inter and JetBrains Mono, already shipped (ATTRIBUTION.md).
eframe = { version = "0.37", default-features = false, features = ["accesskit", "wgpu", "x11", "wayland"] }

[target.'cfg(windows)'.dependencies]
# Native Windows file dialogs of the window.
rfd = { version = "0.18", default-features = false }

# Icon and version information of massicot.exe (build.rs); rc.exe comes from the Windows SDK.
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[dev-dependencies]
massicot-essais = { path = "../essais" }
# Screen tests of the window: rendered and compared with tests/snapshots/ (wgpu).
egui_kittest = { version = "0.37", features = ["eframe", "wgpu", "snapshot"] }
tempfile = "3"
