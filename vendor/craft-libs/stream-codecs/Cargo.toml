[package]
name = "craft-stream-codecs"
description = "Byte-stream and bi-level image codecs that PDF, PostScript and TIFF share: LZW, ASCII85, ASCIIHex, RunLength, TIFF and PNG predictors, CCITT Group 3 and 4 decoding and Group 4 encoding, JBIG2 decoding and lossless encoding"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/craft-libs"
publish = false
autotests = false
autobenches = false
autoexamples = false

[dependencies]
# CCITT Group 4 encoding (ITU-T T.6). MIT.
fax = "0.2.7"
# CCITT fax decoding, the decoder the vendored PDF reader uses. MIT OR Apache-2.0.
hayro-ccitt = {version = "0.3", default-features = false}
# The bounded JBIG2 API is a local extension: consumers do not inherit workspace patches.
# Keep the vendored dependency explicit so Git consumers retain its work-budget safeguards.
hayro-jbig2 = {path = "../../hayro-jbig2", version = "=0.3.0", default-features = false, features = ["std"]}
thiserror = {version = "2"}

[lints.rust]
unsafe_code = "forbid"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(craft_pdf_unicode_fixtures)"]

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
